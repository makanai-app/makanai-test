<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まかない レシピ受け取り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background: #ffffff;
      color: #111111;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 70px 28px 48px;
    }

    .orta {
      display: block;
      width: min(72vw, 280px);
      height: auto;
      margin: 0 auto 34px;
    }

    h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .message {
      margin: 28px 0 0;
      font-size: 20px;
      line-height: 1.6;
      font-weight: 500;
    }

.open-button {
  display: inline-block;
  width: auto;
  min-width: 260px;
  margin-top: 34px;
  padding: 18px 32px;

  appearance: none;
  border: none;
  border-radius: 22px;

  background: #245f3f;
  color: #ffffff;

  font-size: 20px;
  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 8px 20px rgba(0, 0, 0, 0.12);
}
    .helper {
      margin-top: 20px;
      color: #8a8a8a;
      font-size: 15px;
      line-height: 1.5;
    }

    .appstore-note {
      margin-top: 18px;
      color: #777777;
      font-size: 14px;
      line-height: 1.6;
    }

.appstore-note span {
  color: #d96a1d;
  font-weight: 700;
}

    @media (max-width: 360px) {
      .page {
        padding-left: 22px;
        padding-right: 22px;
      }

      h1 {
        font-size: 48px;
      }

      .message {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      src="orta.png"
      alt="おる太"
      class="orta"
    >

    <h1>まかない</h1>

    <p class="message">
      共有されたレシピを受け取ります。
    </p>

    <button
      class="open-button"
      onclick="openMakanai()"
    >
      まかないで開く
    </button>

    <p class="helper">
      タップするとアプリが起動します
    </p>

    <p class="appstore-note">
      まかないアプリをお持ちでない方は
      <span>こちら</span>
    </p>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    function openMakanai() {
      if (!id) {
        alert("レシピIDが見つかりません。");
        return;
      }

      window.location.href =
        "makanai://import?id=" + encodeURIComponent(id);
    }
  </script>

</body>
</html>
